<!doctype html>
<!--
  Offline harness page: plays interface/build/LostArt_Spellmaking.swf in Ruffle with the mock
  DLL (mock_dll.js). Served by run.mjs from the interface/ directory; can also be opened by hand:
    node interface/test/harness/run.mjs --serve     then browse http://127.0.0.1:8765/test/harness/
  Keyboard works as in game. Numpad keys stand in for gamepad buttons (GFx pad codes 96..107):
  0=A 1=B 2=X 3=Y 4=LB 5=LT 6=LS(click) 7=RB 8=RT 9=RS(click) *=Start +=Back.
-->
<html>
<head>
<meta charset="utf-8">
<title>Lost Art spellmaking menu harness</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1f; }
  /* stand-in for the game world behind the menu */
  #world { position: fixed; inset: 0; background:
      radial-gradient(ellipse at 30% 40%, #5b6a7a 0%, #2f3a46 45%, #15191e 100%); }
  #stage { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="world"></div>
<div id="stage"></div>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", splashScreen: false,
    allowScriptAccess: true, letterbox: "off", wmode: "transparent", logLevel: (new URLSearchParams(location.search).get("log") || "warn"), contextMenu: "off" };
</script>
<script src="/.tools/node_modules/@ruffle-rs/ruffle/ruffle.js"></script>
<script src="mock_dll.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const ruffle = window.RufflePlayer.newest();
  const p = ruffle.createPlayer();
  p.style.width = "100vw";
  p.style.height = "100vh";
  document.getElementById("stage").appendChild(p);
  window.LA_PLAYER = p;
  const api = p.ruffle ? p.ruffle() : p;
  await api.load({ url: "/build/LostArt_Spellmaking.swf", parameters: "la_dev=1", allowScriptAccess: true,
    wmode: "transparent", backgroundColor: null });
  const [data, dictText] = await Promise.all([
    fetch("mock_data.json").then((r) => r.json()),
    fetch("/translations/LostArt_UI_ENGLISH.txt").then((r) => r.text()),
  ]);
  const dict = {
    "$LA_Unit_sec": "sec", "$LA_Unit_secs": "secs", "$LA_Unit_ft": "ft",
  };
  for (const line of dictText.split(/\r?\n/)) {
    if (!line || line[0] === "#") continue;
    const t = line.indexOf("\t");
    if (t > 0) dict[line.slice(0, t)] = line.slice(t + 1);
  }
  if (params.get("npc")) data.state.mode = "npc";
  window.LA_DATA = data;
  window.LA_DICT = dict;
  // wait until the movie registered its ExternalInterface callbacks
  for (let i = 0; i < 200 && typeof p.LA_DevStart !== "function"; i++) await new Promise((r) => setTimeout(r, 50));
  p.focus();
  window.LA_MOCK_START(data, dict, { closeAfterCreate: params.get("close") === "1" });
  window.LA_HARNESS_READY = true;
})();
</script>
</body>
</html>
